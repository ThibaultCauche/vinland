name: vinland
description: Lecteur de musique personnel
publish_to: 'none'
version: 1.1.10+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  # just_audio ne declare aucune implementation Windows lui-meme (seulement
  # android/ios/macos/web) -- reserve au mobile/web/macos. Sur Windows on
  # passe par media_kit (voir lib/services/player_engine.dart), plus mature
  # sur ce backend : just_audio_windows (essaye d'abord) plantait en natif
  # (segfault) pendant la lecture reelle d'un flux distant.
  media_kit: ^1.1.11
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  http: ^1.2.0
  metadata_god: ^0.5.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  crypto: ^3.0.3
  palette_generator: ^0.3.3+7
  image: ^4.5.0
  csv: ^6.0.0
  diacritic: ^0.1.6
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  window_manager: ^0.5.2
  flutter_acrylic: ^1.1.4
  flutter_colorpicker: ^1.1.0
  web_socket_channel: ^2.4.0
  open_file: ^4.0.0
  share_plus: ^12.0.2
  app_links: ^7.2.1

dependency_overrides:
  # VS 2026's MSVC now hard-errors on the deprecated /await experimental
  # coroutine flag that permission_handler_windows 0.2.1 still uses; try
  # the next patch release to see if it dropped it.
  permission_handler_windows: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Genere les icones natives (Android/iOS/macOS/Windows/web) a partir du logo
# Vinland -- `dart run flutter_launcher_icons` apres toute modification du
# fichier source.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#121212"
    theme_color: "#121212"

