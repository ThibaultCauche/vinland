name: vinland
description: Lecteur de musique personnel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.46
  audio_service: ^0.18.19
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  http: ^1.2.0
  metadata_god: ^0.5.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # AJOUTE CECI :
  assets:
    - assets/music/
    - assets/music/Arcane League of Legends (Original Score from Act 1 of the Animated Series)/
    - assets/music/Arcane League of Legends (Original Score from Act 2 of the Animated Series)/
    - assets/music/Arcane League of Legends (Original Score from Act 3 of the Animated Series)/

