name: Release

# Se declenche a chaque tag pousse au format vX.Y.Z (ex: git tag v1.1.0 &&
# git push --tags). Build Windows + Android, puis publie une Release GitHub
# avec les deux fichiers attaches. C'est ce que UpdateCheckService (dans
# l'app) interroge pour proposer la mise a jour : il cherche un asset dont le
# nom contient "windows" et finit par ".zip" pour l'auto-update Windows.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-windows:
    # windows-2022 (pas windows-latest) : l'image la plus recente utilise un
    # "Dev Drive" (D:, ReFS) pour le checkout et une toolchain VS plus
    # agressive, qui declenchent respectivement le bug CMake "Cannot extract
    # through symlink" sur l'archive native de metadata_god et un hard-error
    # MSVC sur le flag /await deprecated de permission_handler_windows.
    # windows-2022 reste sur un C: classique (NTFS) et un MSVC plus etabli.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # metadata_god extrait un tar.gz contenant un symlink pendant la
      # config CMake ; sans le mode developpeur Windows, l'extraction echoue
      # ("Cannot extract through symlink") faute de droit de creer des
      # symlinks.
      - name: Enable Windows Developer Mode
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      # lib/config/*.dart sont gitignores (secrets/URLs internes au NAS) et
      # n'existent donc pas dans le checkout CI : on les regenere ici a
      # partir des secrets du repo, avec exactement la forme attendue par le
      # code (voir les memes fichiers en local pour la doc de chaque const).
      - name: Write local config files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib/config | Out-Null
          Set-Content -NoNewline -Encoding utf8 -Path lib/config/credentials.dart -Value @"
          const String kNavidromeUrl = '';
          const String kNavidromeUser = '';
          const String kNavidromePass = '';
          "@
          Set-Content -NoNewline -Encoding utf8 -Path lib/config/discord_config.dart -Value @"
          const String kDiscordFeedbackWebhookUrl = '$env:DISCORD_FEEDBACK_WEBHOOK_URL';
          "@
          Set-Content -NoNewline -Encoding utf8 -Path lib/config/avatar_config.dart -Value @"
          const String kAvatarServiceBaseUrl = '$env:AVATAR_SERVICE_BASE_URL';
          const String kAvatarServiceApiKey = '$env:AVATAR_SERVICE_API_KEY';
          "@
          Set-Content -NoNewline -Encoding utf8 -Path lib/config/download_worker_config.dart -Value @"
          const String kDownloadWorkerServiceBaseUrl = '$env:DOWNLOAD_WORKER_BASE_URL';
          const String kDownloadWorkerServiceApiKey = '$env:DOWNLOAD_WORKER_API_KEY';
          "@
          Set-Content -NoNewline -Encoding utf8 -Path lib/config/share_inbox_config.dart -Value @"
          const String kShareInboxBaseUrl = '$env:SHARE_INBOX_BASE_URL';
          const String kShareInboxApiKey = '$env:SHARE_INBOX_API_KEY';
          "@
        env:
          DISCORD_FEEDBACK_WEBHOOK_URL: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK_URL }}
          AVATAR_SERVICE_BASE_URL: ${{ secrets.AVATAR_SERVICE_BASE_URL }}
          AVATAR_SERVICE_API_KEY: ${{ secrets.AVATAR_SERVICE_API_KEY }}
          DOWNLOAD_WORKER_BASE_URL: ${{ secrets.DOWNLOAD_WORKER_BASE_URL }}
          DOWNLOAD_WORKER_API_KEY: ${{ secrets.DOWNLOAD_WORKER_API_KEY }}
          SHARE_INBOX_BASE_URL: ${{ secrets.SHARE_INBOX_BASE_URL }}
          SHARE_INBOX_API_KEY: ${{ secrets.SHARE_INBOX_API_KEY }}

      - run: flutter pub get
        shell: cmd

      # Execute en cmd, pas pwsh : PowerShell resout les chemins passant par
      # le symlink flutter/ephemeral/.plugin_symlinks en forme longue
      # (\\?\...), ce qui fait declencher a CMake sa protection anti-tar-zip-
      # slip ("Cannot extract through symlink") en extrayant l'archive native
      # de metadata_god. cmd.exe ne normalise pas ces chemins de la meme
      # facon et evite le probleme.
      - name: flutter build windows --release
        shell: cmd
        run: flutter build windows --release

      # Zippe le CONTENU du dossier Release (pas le dossier lui-meme) : le
      # script d'auto-update (self_updater_service.dart) fait un
      # Expand-Archive direct dans le dossier d'install existant, un zip avec
      # un sous-dossier imbrique casserait le remplacement des fichiers.
      - name: Zip Windows build
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "vinland-windows-$tag.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: vinland-windows-*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vinland-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/vinland-release.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # lib/config/*.dart sont gitignores (secrets/URLs internes au NAS) et
      # n'existent donc pas dans le checkout CI : on les regenere ici a
      # partir des secrets du repo, avec exactement la forme attendue par le
      # code (voir les memes fichiers en local pour la doc de chaque const).
      - name: Write local config files
        run: |
          mkdir -p lib/config
          cat > lib/config/credentials.dart <<'EOF'
          const String kNavidromeUrl = '';
          const String kNavidromeUser = '';
          const String kNavidromePass = '';
          EOF
          cat > lib/config/discord_config.dart <<EOF
          const String kDiscordFeedbackWebhookUrl = '$DISCORD_FEEDBACK_WEBHOOK_URL';
          EOF
          cat > lib/config/avatar_config.dart <<EOF
          const String kAvatarServiceBaseUrl = '$AVATAR_SERVICE_BASE_URL';
          const String kAvatarServiceApiKey = '$AVATAR_SERVICE_API_KEY';
          EOF
          cat > lib/config/download_worker_config.dart <<EOF
          const String kDownloadWorkerServiceBaseUrl = '$DOWNLOAD_WORKER_BASE_URL';
          const String kDownloadWorkerServiceApiKey = '$DOWNLOAD_WORKER_API_KEY';
          EOF
          cat > lib/config/share_inbox_config.dart <<EOF
          const String kShareInboxBaseUrl = '$SHARE_INBOX_BASE_URL';
          const String kShareInboxApiKey = '$SHARE_INBOX_API_KEY';
          EOF
        env:
          DISCORD_FEEDBACK_WEBHOOK_URL: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK_URL }}
          AVATAR_SERVICE_BASE_URL: ${{ secrets.AVATAR_SERVICE_BASE_URL }}
          AVATAR_SERVICE_API_KEY: ${{ secrets.AVATAR_SERVICE_API_KEY }}
          DOWNLOAD_WORKER_BASE_URL: ${{ secrets.DOWNLOAD_WORKER_BASE_URL }}
          DOWNLOAD_WORKER_API_KEY: ${{ secrets.DOWNLOAD_WORKER_API_KEY }}
          SHARE_INBOX_BASE_URL: ${{ secrets.SHARE_INBOX_BASE_URL }}
          SHARE_INBOX_API_KEY: ${{ secrets.SHARE_INBOX_API_KEY }}

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Rename APK
        run: |
          tag="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "vinland-android-$tag.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: vinland-android-*.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vinland-windows-*.zip
            vinland-android-*.apk
