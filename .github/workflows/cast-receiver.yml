name: Recepteur Chromecast

# Publie cast-receiver/ (l'ecran tele de Vinland) sur GitHub Pages :
# https://thibaultcauche.github.io/vinland/ . C'est cette adresse qui est
# enregistree dans la Google Cast SDK Developer Console ; la Chromecast la
# charge a chaque diffusion, donc une modification arrive sur la tele des
# que ce workflow a tourne (pas besoin de release de l'app).
on:
  push:
    branches: [main]
    paths: ['cast-receiver/**', '.github/workflows/cast-receiver.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cast-receiver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: cast-receiver

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
