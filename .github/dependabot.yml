# Propose chaque semaine des PR de mise a jour des dependances. Chaque PR
# passe par la CI : ne fusionner que si elle est verte.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
  - package-ecosystem: pub
    directory: /jam_relay
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  # Les actions sont epinglees par SHA (avec la version en commentaire) :
  # Dependabot sait mettre a jour le SHA et le commentaire ensemble.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
